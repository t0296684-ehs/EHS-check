<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="員和環安衛系統">
<meta property="og:title" content="員和環安衛系統">
<meta property="og:description" content="作業檢點、定期檢查線上填寫與簽核">
<meta name="description" content="員和工業 作業檢點、定期檢查線上填寫與簽核">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>員和環安衛系統</title>
<style>
:root{--navy:#14233C;--orange:#FF7A1A;--orT:#9A3A06;--orBg:#FFF1E3;--ink:#15202E;--sub:#5A6575;--mute:#6B7684;
--line:#E6E9EE;--line2:#D5DBE3;--bg:#EDF0F4;--card:#FFFFFF;
--ok:#127A3A;--okT:#0F6630;--okbg:#E3F4EA;--ng:#C0262D;--ngT:#A61B22;--ngbg:#FDE7E7;
--info:#1C5FB0;--infoT:#164C8E;--infobg:#E4EEFB;--na:#3D4754;--nabg:#EDF0F3;--barh:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.ic{flex-shrink:0;display:block}

/* ── 頂部 ── */
#top.topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.tb{display:flex;align-items:center;gap:2px;padding:8px 14px 10px 4px;max-width:720px;margin:0 auto;min-height:62px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}.mnav b{font-size:18px;color:var(--navy);text-align:center;flex:1;white-space:nowrap}.mnav .mnb{width:auto;min-width:96px;min-height:48px;padding:6px 12px;font-size:16px;gap:2px;flex:0 0 auto}.mnav .mnb:disabled{opacity:.35}
html,body{overscroll-behavior-x:none}.calcard{touch-action:pan-y}
html{touch-action:manipulation}.li,.btn,.tact,.tb-back,.chip{transition:transform .08s,background-color .08s}.li:active{background:#F1F4F8}.btn:active:not(:disabled),.tb-back:active{transform:scale(.97)}
.calcard.slideL{animation:slL .22s ease-out}.calcard.slideR{animation:slR .22s ease-out}@keyframes slL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}@keyframes slR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.tb-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px}
.tb-sp{width:12px;flex-shrink:0}
.tb-t{flex:1;min-width:0}
.tb-ttl{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:13px;color:#B9C6DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{display:flex;align-items:center;gap:6px;font-size:13px;color:#D5DEEA;white-space:nowrap;flex-shrink:0}
.net i{width:8px;height:8px;border-radius:50%;background:#5EE08F;display:block}
.net.off{color:#FFD2CC}.net.off i{background:#F28B82}
#top.hero{background:var(--navy);color:#fff;border-radius:0 0 26px 26px;padding:calc(20px + env(safe-area-inset-top)) 20px 24px}
.hero-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.htop{display:flex;align-items:center;gap:4px;margin:-6px -6px -8px 0}.htsp{flex:1}.htop .mbtn{margin-right:4px}
.tact{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:46px;height:48px;padding:0 4px;border-radius:12px;color:#fff;flex-shrink:0}
.tact small{font-size:11px;font-weight:700;line-height:1.1;opacity:.9}.tact:active{background:rgba(255,255,255,.14)}
.tbadge{position:absolute;top:2px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E53935;color:#fff;font-size:11px;font-style:normal;font-weight:800;line-height:18px;text-align:center}
.tb .tact{margin-left:2px}
.hi{display:flex;align-items:flex-start;gap:10px}
.hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.h1{font-size:26px;font-weight:900;line-height:1.3}
.hsub{font-size:15px;color:#B9C6DA}
.hero .net{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:500}
.hs{display:flex;flex-direction:column;gap:10px}
.say{font-size:20px;font-weight:700}
.say b{color:#FF9A4D;font-size:26px;font-weight:900}
.dbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.dbar span{height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.dbar .ok{background:#5EE08F}.dbar .up{background:#6FA8EC}
.hnote{font-size:14px;color:#B9C6DA}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#D5DEEA}
.logo{width:40px;height:40px;border-radius:12px;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* 填寫頁進度（黏在頂部） */
.prog{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(20,35,60,.08)}
.prog-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.pt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:17px;font-weight:700}
.pt b{font-size:24px;font-weight:900;color:var(--navy)}
.pt .pr{font-size:14px;color:var(--orT)}.pt .pr.okt{color:var(--okT)}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:5px}
.pbar i.full{background:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border-radius:14px;background:var(--bg)}
.seg button{height:44px;border-radius:10px;font-weight:700;font-size:15px}
.seg button.on{background:var(--navy);color:#fff}
.seg .ngc{color:var(--ngT)}.seg .ngc.on{color:#fff}

/* ── 頁面 ── */
.page{padding:16px 16px calc(var(--barh) + 28px);max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sec{font-size:17px;font-weight:900;color:var(--navy);padding:8px 4px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec small{font-size:14px;color:var(--sub);font-weight:400}
.sl{display:flex;align-items:center;gap:8px;font-size:19px}
.cnt{min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--orange);color:var(--navy);font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cnt.z{background:var(--ok);color:#fff}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.calm{flex-direction:row;align-items:center;gap:12px;font-size:16px;font-weight:700;color:var(--okT)}
.task{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,35,60,.06)}
.task.first{box-shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.09)}
.task.red{box-shadow:0 0 0 2px var(--ng)}
.tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.tg{font-size:14px;font-weight:700;color:var(--orT)}
.task.red .tg{color:var(--ngT)}
.tt{font-size:22px;font-weight:900;color:var(--navy);line-height:1.3;word-break:break-word}
.tm{font-size:15px;color:var(--sub);word-break:break-word}

/* 按鈕 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 16px;border-radius:16px;
background:var(--orange);color:var(--navy);font-weight:900;font-size:18px;text-align:center;line-height:1.3}
.btn.big{min-height:60px;font-size:20px;letter-spacing:1px}
.btn.navy{background:var(--navy);color:#fff;font-weight:700}
.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy);font-weight:700;font-size:17px;min-height:52px}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #C3CBD6;font-weight:700;font-size:16px;min-height:52px}
.btn.red{background:var(--ng);color:#fff;font-weight:700}
.btn.redline{background:#fff;color:var(--ngT);border:2px solid var(--ng);font-weight:700}
.btn[disabled]{background:#DDE2E9;color:#4A5564;border-color:transparent;cursor:not-allowed;font-weight:700}
.btn.busy[disabled]{background:#FFB27A;color:var(--navy);cursor:progress}
.langpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.langpick .btn.sm{min-height:40px}
.btn.sm{width:auto;min-height:44px;padding:0 14px;font-size:15px;border-radius:12px;font-weight:700;flex-shrink:0;white-space:nowrap}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btns.r12{grid-template-columns:1fr 2fr}.btns.r21{grid-template-columns:2fr 1fr}

/* 清單 */
.list{background:var(--card);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;width:100%;text-align:left;border-bottom:1px solid #EEF0F3;background:none}
.li:last-child{border-bottom:0}
.li.sel{background:#F2F5FA}
.mn{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-size:16px;font-weight:700;word-break:break-word}
.mt{font-size:14px;color:var(--sub);word-break:break-word}
.mt.okt{color:var(--okT)}.mt.inf{color:var(--infoT)}.mt.wn{color:var(--orT)}
.chev{color:#9AA2AE}
.dotic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.dotic.ok{background:var(--ok)}.dotic.info{background:var(--info)}.dotic.na{background:#6B7684}

/* 狀態標籤 */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0}
.p-ok{background:var(--okbg);color:var(--okT)}.p-warn{background:var(--orBg);color:var(--orT)}
.p-ng{background:var(--ngbg);color:var(--ngT)}.p-na{background:var(--nabg);color:var(--na)}
.p-info{background:var(--infobg);color:var(--infoT)}

/* 提示條與錯誤卡 */
.strip{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;font-size:15px;min-height:60px}
.strip .stx{flex:1;min-width:0;display:flex;flex-direction:column}
.strip small{font-size:14px;opacity:.85}
.strip.info{background:var(--infobg);color:#123A6B}.strip.info .ic{color:var(--info)}
.strip.info .btn.sm{background:#fff;color:var(--info)}
.strip.off{background:#2B3647;color:#fff}
.box{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:16px}
.box .r{display:flex;gap:10px;align-items:flex-start}
.box .r .ic{margin-top:1px}
.box .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.box b{font-size:16px}
.box .m{font-size:14px;line-height:1.55;word-break:break-word}
.box.err{background:var(--ngbg);color:#7A1410}.box.err .r .ic{color:var(--ng)}
.box.warn{background:#FFF4E6;color:#6B2E05}.box.warn .r .ic{color:#C2410C}
.box.info{background:var(--infobg);color:#123A6B}.box.info .r .ic{color:var(--info)}
.box .list{border-radius:14px}
.box.err .btn.sm,.box.err .btns .btn{min-height:46px}

/* 磚塊入口 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:92px;border-radius:16px;background:var(--card);text-align:left;color:var(--navy)}
.tile .tr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;width:100%}
.tile b{font-size:16px}
.tile small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.tile .pill{font-size:13px;padding:2px 8px}
.ver{text-align:center;font-size:13px;color:var(--mute);padding-top:4px}

/* 填寫 */
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;color:var(--sub);padding:0 4px}
.hint{font-size:13px;color:var(--sub);padding:0 4px}
.field{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;font-size:17px}
.field.bad{border:2px solid var(--ng)}
input[type=date].field{font-weight:700;-webkit-appearance:none;appearance:none}
.dwrap{display:flex;flex-direction:column;gap:6px}
.meta{font-size:15px;color:var(--sub);padding:0 4px}
.grp{font-size:15px;font-weight:900;color:var(--navy);padding:8px 4px 0}
.item{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .25s;scroll-margin-top:200px}
.item.bad{box-shadow:0 0 0 2px var(--ng)}
.item.next{box-shadow:0 0 0 2px var(--orange)}
.item.flash{box-shadow:0 0 0 5px var(--orange)}
.q{display:flex;gap:10px;align-items:flex-start}
.no{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--nabg);color:var(--na);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.item.bad .no{background:var(--ng);color:#fff}.item.next .no{background:var(--orange);color:var(--navy)}
.qt{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.5;word-break:break-word}
.qt small{font-weight:400;color:var(--sub);font-size:14px}
.tag{font-size:13px;font-weight:700;color:var(--orT);white-space:nowrap;margin-top:3px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.n1{grid-template-columns:1fr}
.opt{min-height:52px;padding:6px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;color:var(--na);font-size:16px;font-weight:700;
display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.25;text-align:center}
.opt.on{border-color:transparent;color:#fff}
.opt.on.ok{background:var(--ok)}.opt.on.ng{background:var(--ng)}.opt.on.warn{background:#B45309}.opt.on.na{background:#5B6573}
.nwrap{display:flex;flex-direction:column;gap:6px}
.nl{font-size:14px;font-weight:700;color:var(--sub)}.nl.req{color:var(--ngT)}
.note{width:100%;min-height:84px;padding:10px 12px;border:2px solid var(--ng);border-radius:12px;background:#FFF8F8;font-size:16px;resize:vertical;display:block}
.note.plain{border:1.5px solid var(--line2);background:#fff}
.sigcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1.5px dashed #C3CBD6}
.sigcard img{max-width:140px;max-height:56px;display:block}
.sigcard .stx{display:flex;flex-direction:column;font-size:14px;color:var(--sub)}
.sigcard .stx b{color:var(--ink);font-size:15px}
.empty{text-align:center;color:var(--sub);padding:28px 12px;background:#fff;border-radius:18px;font-size:16px}

/* 月結 */
.mr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{display:flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:700;color:var(--info);text-decoration:none;border-top:1px solid #EEF0F3;padding-top:6px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:14px;background:#DDE2E9}
.seg2 button{height:44px;border-radius:10px;font-weight:700;font-size:16px;color:var(--na)}
.seg2 .on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,35,60,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #C3CBD6;background:#fff;font-size:15px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bdg{padding:0 7px;border-radius:999px;background:var(--ng);color:#fff;font-size:13px}
.stats{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:14px;color:var(--na)}
.stats b{font-size:16px;color:var(--ink)}
.stats .ng,.stats .ng b{color:var(--ngT)}.stats .wn,.stats .wn b{color:var(--orT)}
.calw,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calw span{text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.cd{height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;color:#8A939F;font-weight:500}
.cd small{font-size:11px;line-height:1.1;font-weight:700}
.cd.ok{background:var(--okbg);color:var(--ink);font-weight:700}.cd.ok .ic{color:var(--ok)}
.cd.bad{background:var(--ng);color:#fff;font-weight:700}
.cd.nw{background:#E2E6EB;color:var(--na);font-weight:700}
.cd.miss{border:2px dashed #B5BEC9;color:var(--na)}
.cd.late{box-shadow:inset 0 0 0 2px var(--orange)}
.cd.late small.lt{color:var(--orT);font-weight:900}
.cd.bad small.lt{color:#fff}
.cd.sel{outline:3px solid var(--navy);outline-offset:2px}
.cd[disabled]{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--na);border-top:1px solid #EEF0F3;padding-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.dday{box-shadow:0 0 0 2px var(--navy)}
.dday .mr b{font-size:17px;font-weight:900}.dday .mr span{font-size:14px;color:var(--sub)}
.dbad{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--ngbg);color:#7A1410}
.dbad .ic{color:var(--ng);margin-top:2px}
.dbad b{font-size:16px}.dbad div{display:flex;flex-direction:column;gap:4px;font-size:15px;min-width:0;word-break:break-word}
.grid{overflow-x:auto;background:#fff;border-radius:14px;-webkit-overflow-scrolling:touch}
.grid table{border-collapse:collapse;font-size:13px}
.grid th,.grid td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
.grid th{background:#F6F7F9;font-weight:700}
.grid td.t,.grid th.t{text-align:left;white-space:normal;min-width:150px;max-width:190px;position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
.grid th.t{background:#F6F7F9}
.grid td.bad{background:var(--ngbg);color:var(--ng);font-weight:700}
.grid th.late{background:#FFE7CF}
.sheet .sr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF0F3}
.sheet .sr div{flex:1;min-width:0;font-size:15px;word-break:break-word}
.sheet .sr small{display:block;color:var(--ngT);font-size:14px}
.ex{font-size:14px;word-break:break-word}

/* 簽名 */
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--sub)}
.steps i{height:6px;border-radius:3px;background:var(--line2);display:block}
.steps .cur{color:var(--navy);font-weight:700}.steps .cur i{background:var(--orange)}
.steps .done{color:var(--okT);font-weight:700}.steps .done i{background:var(--ok)}
.steps span{display:flex;align-items:center;gap:4px}
